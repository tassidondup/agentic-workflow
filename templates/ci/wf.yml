# wf CI. Installed as .github/workflows/wf.yml. Each job name is a required status check (see ruleset.json).
# Trust model: with `pull_request`, GitHub runs the workflow file from the PR's own merge commit, so this file is
# NOT protected by being on the base branch. It is protected by the CODEOWNERS review of /.github/ (an approver must
# approve any change to it) and by the ruleset. Given that, the layout keeps the PR from changing the code that
# judges it: wf runs from `trusted/`, a checkout of the PR's BASE commit, which is a sibling of the PR checkout
# `pr/` (not inside it, so the PR's node_modules cannot shadow wf's imports and vitest cannot find its tests).
# The PR's files are only data. Untrusted values (branch names, SHAs) enter through env and are quoted in scripts;
# no expression is interpolated into a run: script, and no secret reaches a step that runs PR code.
# bin.js MUST be a self-contained bundle that resolves nothing from node_modules (installer, Plan 3); the
# "PR cannot change its judge" guarantee holds only then.
name: wf
on:
  pull_request:
    # The installer replaces `main` with the repo's default branch. wf must only ever run for PRs into a protected
    # branch, because trusted/ is that base's commit: a PR into an unprotected branch would be judged by code that
    # branch's writers control, and its green checks could show on a head SHA.
    branches: [main]
    types: [opened, synchronize, reopened, edited] # edited fires when the base branch changes
permissions:
  contents: read
defaults:
  run:
    working-directory: pr
env:
  WF: node ../trusted/.workflow/wf/bin.js # path owned by the installer (Plan 3); relative to pr/
jobs:
  gate-check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0 # full history: wf's provenance check rejects shallow clones
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # setup-node would otherwise enable caching from the PR's package.json
      - run: $WF pr-check --base "$BASE_SHA" --base-branch "$BASE_REF" --branch "$HEAD_REF" --repo "$REPO"

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0 # same checkout in every job; memory-check itself reads no git history
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # setup-node would otherwise enable caching from the PR's package.json
      - run: $WF memory-check

  stage-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0 # full history: classify diffs against the merge-base of the base SHA (three-dot)
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # setup-node would otherwise enable caching from the PR's package.json
      - id: classify
        run: $WF classify --base "$BASE_SHA" --branch "$HEAD_REF" >> "$GITHUB_OUTPUT"
      - if: steps.classify.outputs.kind == 'change'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
        run: $WF stage-check "$CHANGE"

  verify:
    needs: stage-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      nonce: ${{ steps.nonce.outputs.nonce }}
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0 # full history: classify diffs against the merge-base of the base SHA (three-dot)
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # setup-node would otherwise enable caching from the PR's package.json
      - id: classify
        run: $WF classify --base "$BASE_SHA" --branch "$HEAD_REF" >> "$GITHUB_OUTPUT"
      # A fresh random name for this run's must-fail canary test (ADR 0002 layer 1). trace-check checks the same one.
      - id: nonce
        run: echo "nonce=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
      # --base: the command, setup and report path come from the BASE commit's workflow.config.json, so a PR cannot
      # swap in a test command that exits 0 without running its tests. A change to them takes effect once merged.
      # --isolate: setup and the command run in containers from test.image (setup with network, the command without),
      # so nothing PR code starts can outlive the run and rewrite the report. Needs Docker on the runner.
      # --canary: a test that must fail is added; the run passes only if it alone failed. This detects blanket
      # forgeries, not a forger that reads the canary (design: Trust boundary); layer 3 is what prevents that.
      - env:
          CANARY: ${{ steps.nonce.outputs.nonce }}
        run: $WF run-tests --base "$BASE_SHA" --isolate --canary "$CANARY" --report-out .wf-report/junit.xml
      # No `if: always()`: a failed test run uploads nothing, so trace-check cannot run on a stale report.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-report
          path: pr/.wf-report/junit.xml
          include-hidden-files: true # the report sits in the dot-directory .wf-report, which upload-artifact skips by default
          if-no-files-found: error # default is warn; a missing report must fail verify, not pass silently

  trace-check:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0 # full history: classify diffs against the merge-base of the base SHA (three-dot)
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # setup-node would otherwise enable caching from the PR's package.json
      - id: classify
        run: $WF classify --base "$BASE_SHA" --branch "$HEAD_REF" >> "$GITHUB_OUTPUT"
      - if: steps.classify.outputs.kind == 'change'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-report
          path: pr/.wf-report
      - if: steps.classify.outputs.kind == 'change'
        env:
          CHANGE: ${{ steps.classify.outputs.change }}
          CANARY: ${{ needs.verify.outputs.nonce }}
        run: $WF trace-check "$CHANGE" --report .wf-report/junit.xml --canary "$CANARY"
